<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030911" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <title>Lost on the river | Neon River</title>
    <style>
      @font-face {
        font-family: 'Silkscreen';
        src: url('/fonts/Silkscreen-Regular.ttf') format('truetype');
      }
      @font-face {
        font-family: 'DotGothic16';
        src: url('/fonts/DotGothic16-Latin.ttf') format('truetype');
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #030911;
        color: #cfe8ee;
        font-family: 'Silkscreen', monospace;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        text-align: center;
      }
      img {
        width: 192px;
        height: 192px;
        image-rendering: pixelated;
        border: 2px solid #12303f;
      }
      h1 {
        margin: 0;
        font: 40px 'DotGothic16', monospace;
        letter-spacing: 3px;
        color: #7df2e4;
      }
      p {
        margin: 0;
        font-size: 14px;
        letter-spacing: 2px;
      }
      a {
        display: inline-block;
        padding: 14px 22px;
        background: #6b4a3a;
        border: 2px solid #030911;
        outline: 2px solid #8a6450;
        color: #f4d27a;
        font-size: 16px;
        letter-spacing: 2px;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        outline-color: #7df2e4;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="The river winding down from the neon city" />
      <h1>NOTHING BITING HERE</h1>
      <p>THIS BEND OF THE RIVER DOES NOT EXIST.</p>
      <a href="/">BACK TO THE RIVER</a>
    </main>
  </body>
</html>
