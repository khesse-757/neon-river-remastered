name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required. No browser: lint, types, the quick unit tests, the build and the secret scans.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (quick; the many-seed nights run in the pre-commit hook and full-e2e)
        run: npm run test:quick
      - name: Build (postbuild scans dist for secrets)
        run: npm run build
      - name: Secret scan (tracked files)
        run: node scripts/check-secrets.mjs --tracked

  # Required. One short desktop test on the cheapest picture. Skipped (and green) for docs-only changes.
  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request HEAD is the merge commit, so HEAD^1..HEAD is the whole change.
          fetch-depth: 2
      - name: Docs-only change?
        id: changes
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '(^docs/|\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.code == 'true'
      - name: Playwright version
        id: pw
        if: steps.changes.outputs.code == 'true'
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pwcache
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.changes.outputs.code == 'true' && steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Smoke
        if: steps.changes.outputs.code == 'true'
        run: npm run test:smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
