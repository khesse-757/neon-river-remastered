<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#030911" />
    <meta
      name="description"
      content="Neon River: a night-fishing arcade game in a pixel-art painting brought to life in 3D. Catch 200 lb, let no more than 20 lb escape, and never net an electric eel."
    />
    <link rel="canonical" href="https://neonriver2.kahdev.me/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Neon River" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Neon River" />
    <meta property="og:url" content="https://neonriver2.kahdev.me/" />
    <meta property="og:title" content="Neon River: a night on the water" />
    <meta
      property="og:description"
      content="A night-fishing arcade game in a pixel-art painting brought to life in 3D. Catch 200 lb, dodge the electric eels. Free in the browser, on phones and desktop."
    />
    <meta property="og:image" content="https://neonriver2.kahdev.me/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Neon River: a moonlit pixel-art river winding down from a neon city skyline" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Neon River: a night on the water" />
    <meta
      name="twitter:description"
      content="A night-fishing arcade game in a pixel-art painting brought to life in 3D. Catch 200 lb, dodge the electric eels."
    />
    <meta name="twitter:image" content="https://neonriver2.kahdev.me/og.png" />
    <meta name="twitter:image:alt" content="Neon River: a moonlit pixel-art river winding down from a neon city skyline" />
    <title>Neon River</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Neon River: slide the net across the river to catch fish"></canvas>
      <div id="overlay">
        <div id="safe-area" aria-hidden="true"></div>
        <p id="status" role="status" aria-live="polite"></p>
        <button id="btn-settings" type="button" aria-label="Settings"></button>
        <button id="btn-mute" type="button" aria-pressed="false" aria-label="Sound on. Turn sound off"></button>
        <button id="btn-start" type="button" aria-label="Start fishing"></button>
        <button id="btn-resume" type="button" aria-label="Resume"></button>
        <button id="btn-retry" type="button" aria-label="Fish again"></button>
        <button id="btn-home" type="button" aria-label="Back to the title screen"></button>
        <button id="btn-keep" type="button" aria-label="Keep fishing"></button>
        <button id="btn-mode-zen" type="button" aria-pressed="false" aria-label="Zen mode"></button>
        <button id="btn-mode-normal" type="button" aria-pressed="false" aria-label="Normal mode"></button>
        <button id="btn-mode-hard" type="button" aria-pressed="false" aria-label="Storm Night mode"></button>
        <button id="btn-guide" type="button" aria-label="Field guide"></button>
        <div id="settings-scroll" role="group" aria-label="Settings" hidden></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
