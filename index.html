<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#030911" />
    <meta
      name="description"
      content="Neon River: a pixel-art night-fishing arcade game. Catch 200 lb, do not let 20 lb escape, never net an electric eel."
    />
    <link rel="icon" href="data:," />
    <title>Neon River</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Neon River: slide the net across the river to catch fish"></canvas>
      <div id="overlay">
        <div id="safe-area" aria-hidden="true"></div>
        <p id="status" role="status" aria-live="polite"></p>
        <button id="btn-settings" type="button" aria-label="Pause and sound settings"></button>
        <button id="btn-mute" type="button" aria-pressed="false" aria-label="Sound on. Turn sound off"></button>
        <button id="btn-start" type="button" aria-label="Start fishing"></button>
        <button id="btn-resume" type="button" aria-label="Resume"></button>
        <button id="btn-retry" type="button" aria-label="Fish again"></button>
        <input id="tog-music" type="checkbox" aria-label="Music on" />
        <input id="vol-music" type="range" min="0" max="100" step="5" aria-label="Music volume" />
        <input id="tog-ambience" type="checkbox" aria-label="Ambience on" />
        <input id="vol-ambience" type="range" min="0" max="100" step="5" aria-label="Ambience volume" />
        <input id="tog-notes" type="checkbox" aria-label="Fish notes on" />
        <input id="vol-notes" type="range" min="0" max="100" step="5" aria-label="Fish notes volume" />
        <input id="tog-sfx" type="checkbox" aria-label="Splashes and effects on" />
        <input id="vol-sfx" type="range" min="0" max="100" step="5" aria-label="Splashes and effects volume" />
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
